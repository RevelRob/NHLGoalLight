; PlatformIO Project Configuration for Rob's NHL Goal Light
[platformio]
src_dir = .

[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
    dfrobot/DFRobot_DF1201S @ ^1.0.1
build_flags =
    -DARDUINO_SEEED_XIAO_ESP32C3

[env:esp32s3_super_mini]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
    dfrobot/DFRobot_DF1201S @ ^1.0.1

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
    dfrobot/DFRobot_DF1201S @ ^1.0.1
